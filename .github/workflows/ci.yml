# Checks that pushed code passes lint/typecheck.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: mise check:agents
      - run: mise build:gameface
      - run: git diff --exit-code
      - run: mise test:gameface
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build agents-plugins.slnx
      # The evaluator integration tests launch a headless Mono debuggee; mono-devel (not
      # mono-runtime, which lacks the net4x facade assemblies) puts mono on PATH, and the tests
      # skip when it is absent.
      - run: sudo apt-get install -y mono-devel
      - run: dotnet test agents-plugins.slnx --no-build
