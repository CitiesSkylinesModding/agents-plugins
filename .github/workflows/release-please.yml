# Maintains a rolling release PR that bumps versions and changelogs from Conventional Commits.
# Merging that PR tags and creates the GitHub Releases. Release-please acts as a GitHub App rather
# than as GITHUB_TOKEN, since GitHub holds the CI runs of a PR the GITHUB_TOKEN opened for approval.
# A release of an mcp then publishes it, to npm or NuGet, through trusted publishing (OIDC): both
# registries trust this workflow file by name, so renaming it breaks publishing.
# A manual run publishes the given tag, to retry or backfill a release its registry never got.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of an mcp to publish (ex. gameface-devtools-mcp-v1.2.0).
        required: true

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      gameface-mcp-released: ${{ steps.release.outputs['plugins/coherent-gameface/mcp--release_created'] }}
      unity-mcp-released: ${{ steps.release.outputs['plugins/unity-devtools/mcp--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.gameface-mcp-released == 'true' || startsWith(inputs.tag, 'gameface-devtools-mcp-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # Publishes a bundle built from the released sources rather than trusting the committed one.
      - run: mise build:gameface
      # Trusted publishing needs npm 11.5.1+, newer than the one the pinned Node ships.
      - run: npm install --global npm@^11.5.1
      - run: npm publish
        working-directory: plugins/coherent-gameface/mcp

  publish-nuget:
    needs: release-please
    if: ${{ needs.release-please.outputs.unity-mcp-released == 'true' || startsWith(inputs.tag, 'unity-devtools-mcp-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: jdx/mise-action@v4
      - run: mise build:unity:pack
      # Logs in after the build: the API key it issues expires an hour later.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      # Skipping a version already on NuGet makes a retry after a partial failure safe to rerun.
      - run: >-
          dotnet nuget push dist/*.nupkg --skip-duplicate
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
        working-directory: plugins/unity-devtools/mcp
