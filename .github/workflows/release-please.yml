# Maintains a rolling release PR that bumps versions and changelogs from Conventional Commits.
# Merging that PR tags and creates the GitHub Releases. Requires the org/repo setting
# "Allow GitHub Actions to create and approve pull requests" to be enabled.
# A release of the gameface mcp then publishes it to npm through trusted publishing (OIDC): the
# npm package trusts this workflow file by name, so renaming it breaks publishing.
# A manual run publishes the given tag, to retry or backfill a release that never reached npm.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm (ex. gameface-devtools-mcp-v1.2.0).
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      gameface-mcp-released: ${{ steps.release.outputs['plugins/coherent-gameface/mcp--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.gameface-mcp-released == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # Publishes a bundle built from the released sources rather than trusting the committed one.
      - run: mise build:gameface
      # Trusted publishing needs npm 11.5.1+, newer than the one the pinned Node ships.
      - run: npm install --global npm@^11.5.1
      - run: npm publish
        working-directory: plugins/coherent-gameface/mcp
